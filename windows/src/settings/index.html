<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Settings</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<link rel="stylesheet" href="../ui.css">
<style>
  main { max-width: 640px; margin: 0 auto; padding: 8px 24px 40px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 28px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  label.row { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  label.row > span:first-child { flex: 1; }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
  .bad { color: var(--bad); font-size: 12px; }
  .count { color: var(--muted); font-size: 12px; }
  textarea { width: 100%; height: 120px; box-sizing: border-box; font: 12px Consolas, monospace; }
  .actions { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<main id="form"></main>
<script src="settings.js"></script>
</body>
</html>
