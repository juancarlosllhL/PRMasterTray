# Temporary. Answers one question before release.yml is changed: which runner
# gives an SDK matching what development actually uses, and does the app still
# build and test there. Deleted once release.yml is updated.
name: Toolchain probe

on:
  push:
    branches: ["ci/toolchain-probe"]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          echo "runner: ${{ matrix.runner }}"
          swift --version
          xcodebuild -version

      - name: Test
        run: make test

      - name: Build the bundle
        run: make bundle

      # The number that actually matters: the SDK the shipped binary is linked
      # against is what decides SwiftUI's layout defaults.
      - name: Linked SDK
        run: |
          otool -l .build/PRMaster.app/Contents/MacOS/PRMaster \
            | grep -A4 LC_BUILD_VERSION | grep -E 'minos|sdk'
