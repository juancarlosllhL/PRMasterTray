name: Release (Windows)

# Tag-driven, and kept apart from the macOS release: the tag is windows-v<version>,
# which the macOS workflow's `v*` filter never matches, and the in-app updater of
# each platform only looks at its own tags.
on:
  push:
    tags: ["windows-v*"]

# gh release create writes to the repo. Without this it gets a 403.
permissions:
  contents: write

jobs:
  release:
    # Pinned rather than windows-latest: the runner image is part of what ships.
    runs-on: windows-2025

    defaults:
      run:
        shell: bash
        working-directory: windows

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: windows/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: windows/pnpm-lock.yaml

      # First, and before anything expensive. The updater compares a release tag
      # against the running app's version, so a tag that disagrees with
      # package.json would re-offer an update the user already has, or never fire.
      # Passed through the environment rather than interpolated into the command: a
      # tag name may legally contain backticks or $(…), and in an environment
      # variable the value reaches the script verbatim.
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/verify-version.mjs

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build the installer
        run: pnpm run dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="$REF_NAME" node scripts/release-notes.mjs > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            gh release create "$REF_NAME" dist/PRMaster-Setup.exe \
              --title "PR Master for Windows $REF_NAME" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            echo "No changelog section for $REF_NAME; falling back to generated notes."
            gh release create "$REF_NAME" dist/PRMaster-Setup.exe \
              --title "PR Master for Windows $REF_NAME" \
              --generate-notes
          fi

      # The in-app updater refuses to install an asset with no published digest: it
      # fails closed rather than skipping the integrity check. That makes the digest
      # load-bearing, so its absence is a release failure and not something to
      # discover on a user's machine.
      - name: Confirm the installer carries a sha256 digest
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          digest=$(gh release view "$REF_NAME" --json assets \
            --jq '.assets[] | select(.name == "PRMaster-Setup.exe") | .digest')
          if [ -z "$digest" ]; then
            echo "The release asset has no digest. The updater fails closed"
            echo "without one, so this release would not be installable."
            exit 1
          fi
          echo "asset digest: $digest"
